services:
  - type: web
    name: floretttz-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLORETTTZ_ENV
        value: production
      - key: FLORETTTZ_FRONTEND_URL
        value: https://floretttz.vercel.app
      - key: FLORETTTZ_ALLOWED_ORIGINS
        value: https://floretttz.vercel.app,http://localhost:3000
      - key: FLORETTTZ_DATABASE_URL
        sync: false
      - key: FLORETTTZ_WHATSAPP_NUMBER
        value: "917533832123"
      - key: FLORETTTZ_WHATSAPP_BUSINESS_NUMBER
        value: "+917533832123"
      - key: FLORETTTZ_WHATSAPP_GROUP_URL
        value: "https://chat.whatsapp.com/KpDZ3hfIAJH4iFLWSTyXjw?s=cl&p=a&iam=2"
      - key: FLORETTTZ_SUPABASE_URL
        value: https://tzemepkyhzxhtiohdcrh.supabase.co
      - key: FLORETTTZ_SUPABASE_JWKS_URL
        value: https://tzemepkyhzxhtiohdcrh.supabase.co/auth/v1/.well-known/jwks.json
      - key: FLORETTTZ_NOTION_API_KEY
        sync: false
      - key: FLORETTTZ_ADMIN_NAME
        value: ISHUPISHU
      - key: FLORETTTZ_ADMIN_PHONE_NUMBER
        value: "7533832123"
      - key: FLORETTTZ_ADMIN_EMAIL
        value: floretttz@gmail.com
      - key: FLORETTTZ_ADMIN_PASSWORD
        sync: false
      - key: FLORETTTZ_ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
