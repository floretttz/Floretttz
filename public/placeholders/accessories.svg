<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="50%" stop-color="#FCEEF2"/>
      <stop offset="100%" stop-color="#FADFE8"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="charmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A2828" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <circle cx="400" cy="380" r="260" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="400" cy="380" r="220" fill="none" stroke="#E3C4BC" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Handcrafted Keychain & Charm Group -->
  <g filter="url(#softShadow)">
    <!-- Lobster Clasp / Key Ring at Top -->
    <g transform="translate(400, 200)">
      <!-- Main Split Ring -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="url(#silverGrad)" stroke-width="12"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.4"/>
      <!-- Small Swivel Connector -->
      <rect x="-8" y="45" width="16" height="25" rx="5" fill="url(#silverGrad)"/>
      <ellipse cx="0" cy="78" rx="14" ry="12" fill="none" stroke="url(#silverGrad)" stroke-width="8"/>
    </g>

    <!-- Beaded Chain -->
    <g stroke="#374151" stroke-width="2">
      <!-- Pearl 1 -->
      <circle cx="400" cy="305" r="14" fill="#FFFFFF" stroke="#E5E7EB"/>
      <circle cx="396" cy="301" r="4" fill="#FFFFFF"/>
      <!-- Crystal 2 -->
      <circle cx="400" cy="336" r="12" fill="#FBCFE8" stroke="#F472B6"/>
      <!-- Pearl 3 -->
      <circle cx="400" cy="365" r="14" fill="#FFFFFF" stroke="#E5E7EB"/>
      <circle cx="396" cy="361" r="4" fill="#FFFFFF"/>
      <!-- Mint Bead 4 -->
      <circle cx="400" cy="395" r="11" fill="#A7F3D0" stroke="#10B981"/>
    </g>

    <!-- Handcrafted Floral Pipe-Cleaner Charm in Center -->
    <g transform="translate(400, 480)">
      <!-- 5 Petals -->
      <g fill="url(#charmGrad)" stroke="#BE185D" stroke-width="3">
        <circle cx="0" cy="-60" r="32"/>
        <circle cx="57" cy="-18" r="32"/>
        <circle cx="35" cy="48" r="32"/>
        <circle cx="-35" cy="48" r="32"/>
        <circle cx="-57" cy="-18" r="32"/>
      </g>
      <!-- Petal Inner Shading for Fuzzy Pipe Cleaner Texture -->
      <g fill="#F472B6" opacity="0.6">
        <circle cx="0" cy="-60" r="20"/>
        <circle cx="57" cy="-18" r="20"/>
        <circle cx="35" cy="48" r="20"/>
        <circle cx="-35" cy="48" r="20"/>
        <circle cx="-57" cy="-18" r="20"/>
      </g>
      <!-- Center Smiling Disc / Gem -->
      <circle cx="0" cy="0" r="32" fill="#FDE047" stroke="#D97706" stroke-width="4"/>
      <circle cx="0" cy="0" r="24" fill="#FEF08A"/>
      <!-- Pearl Accents -->
      <circle cx="-9" cy="-5" r="4" fill="#78350F"/>
      <circle cx="9" cy="-5" r="4" fill="#78350F"/>
      <path d="M-8 8 Q0 16 8 8" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Dangling Mini Charms / Tassels -->
    <g transform="translate(340, 420) rotate(-15)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#9CA3AF" stroke-width="3"/>
      <!-- Star Charm -->
      <path d="M0 45 L3 53 L11 54 L5 60 L7 68 L0 63 L-7 68 L-5 60 L-11 54 L-3 53 Z" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    </g>
    <g transform="translate(460, 420) rotate(15)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#9CA3AF" stroke-width="3"/>
      <!-- Heart Charm -->
      <path d="M0 48 C-8 36 -20 44 -12 56 L0 68 L12 56 C20 44 8 36 0 48 Z" fill="#B35D6F" stroke="#8C3F50" stroke-width="2"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#D97706" opacity="0.85">
    <path d="M220 250 Q225 265 240 270 Q225 275 220 290 Q215 275 200 270 Q215 265 220 250 Z"/>
    <path d="M580 260 Q584 272 596 276 Q584 280 580 292 Q576 280 564 276 Q576 272 580 260 Z"/>
    <path d="M210 490 Q214 500 224 503 Q214 506 210 516 Q206 506 196 503 Q206 500 210 490 Z"/>
    <path d="M590 480 Q594 490 604 493 Q594 496 590 506 Q586 496 576 493 Q586 490 590 480 Z"/>
  </g>

  <!-- Bottom Brand Sample Badge -->
  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.94" stroke="#29483B" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="-160" cy="0" r="5" fill="#B35D6F"/>
    <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#29483B" letter-spacing="1.2">
      FLORETTTZ • KEYCHAINS &amp; CHARMS
    </text>
  </g>
</svg>
