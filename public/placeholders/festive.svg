<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="50%" stop-color="#FDF1E8"/>
      <stop offset="100%" stop-color="#FBE5D8"/>
    </linearGradient>
    <linearGradient id="diyaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#B84A39"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="25%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEB887"/>
      <stop offset="100%" stop-color="#AA7744"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A2828" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Ambient Warm Golden Halo -->
  <circle cx="400" cy="360" r="280" fill="url(#flameGlow)"/>
  <circle cx="400" cy="380" r="220" fill="none" stroke="#E6CEBD" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Festive Hamper & Lotus Diya Group -->
  <g filter="url(#softShadow)">
    <!-- Woven Cane Hamper Tray Base -->
    <ellipse cx="400" cy="540" rx="210" ry="50" fill="url(#basketGrad)" stroke="#8B5A2B" stroke-width="3"/>
    <ellipse cx="400" cy="532" rx="198" ry="42" fill="#E8C8A0"/>
    
    <!-- Woven Pattern Detail -->
    <path d="M220 535 Q400 580 580 535" stroke="#8B5A2B" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>
    <path d="M250 525 Q400 565 550 525" stroke="#8B5A2B" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>

    <!-- Handcrafted Terracotta Lotus Diya in Center -->
    <g transform="translate(400, 460)">
      <!-- Outer Lotus Petals of Diya -->
      <g fill="#F97316" stroke="#C2410C" stroke-width="2.5">
        <path d="M-90 -10 C-110 -40 -70 -70 -40 -35 Z"/>
        <path d="M90 -10 C110 -40 70 -70 40 -35 Z"/>
        <path d="M-60 10 C-90 -15 -60 -55 -20 -25 Z"/>
        <path d="M60 10 C90 -15 60 -55 20 -25 Z"/>
      </g>
      <!-- Diya Clay Bowl -->
      <path d="M-80 0 Q0 70 80 0 Q60 -30 0 -25 Q-60 -30 -80 0 Z" fill="url(#diyaGrad)" stroke="#7C2D12" stroke-width="3"/>
      <!-- Gold Rim Filigree -->
      <path d="M-75 0 Q0 55 75 0" stroke="#FDE047" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
      <!-- Oil Pool in Bowl -->
      <ellipse cx="0" cy="-6" rx="46" ry="16" fill="#FDE047" stroke="#EA580C" stroke-width="2"/>
      
      <!-- Diya Flame -->
      <g transform="translate(0, -22)">
        <!-- Outer Flame Flare -->
        <circle cx="0" cy="-40" r="45" fill="url(#flameGlow)"/>
        <!-- Main Flame Shape -->
        <path d="M0 -90 C25 -55 30 -20 0 0 C-30 -20 -25 -55 0 -90 Z" fill="#F97316"/>
        <path d="M0 -80 C18 -50 20 -20 0 0 C-20 -20 -18 -50 0 -80 Z" fill="#FDE047"/>
        <path d="M0 -65 C10 -40 12 -15 0 0 C-12 -15 -10 -40 0 -65 Z" fill="#FFFFFF"/>
        <!-- Blue Base of Flame -->
        <ellipse cx="0" cy="-4" rx="8" ry="4" fill="#60A5FA" opacity="0.8"/>
      </g>
    </g>

    <!-- Festive Goodies & Hampers Surrounding Diya -->
    <!-- Sweet / Dry Fruit Box Left -->
    <g transform="translate(250, 470) rotate(-10)">
      <rect x="0" y="0" width="70" height="55" rx="8" fill="#B35D6F" stroke="#8C3F50" stroke-width="2"/>
      <rect x="30" y="0" width="10" height="55" fill="#FDE047"/>
      <circle cx="35" cy="0" r="8" fill="#F59E0B"/>
    </g>
    <!-- Marigold Garland Right -->
    <g transform="translate(520, 480)">
      <circle cx="0" cy="0" r="16" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <circle cx="28" cy="10" r="15" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>
      <circle cx="54" cy="22" r="16" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="#FDE047"/>
      <circle cx="28" cy="10" r="8" fill="#FCA5A5"/>
      <circle cx="54" cy="22" r="9" fill="#FDE047"/>
    </g>

    <!-- Golden Sparkle Light Beams -->
    <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="280" y1="290" x2="250" y2="270"/>
      <line x1="520" y1="290" x2="550" y2="270"/>
      <line x1="400" y1="230" x2="400" y2="195"/>
      <line x1="330" y1="250" x2="310" y2="225"/>
      <line x1="470" y1="250" x2="490" y2="225"/>
    </g>
  </g>

  <!-- Floating Sparkles -->
  <g fill="#D97706" opacity="0.85">
    <path d="M210 230 Q215 245 230 250 Q215 255 210 270 Q205 255 190 250 Q205 245 210 230 Z"/>
    <path d="M590 220 Q594 232 606 236 Q594 240 590 252 Q586 240 574 236 Q586 232 590 220 Z"/>
  </g>

  <!-- Bottom Brand Sample Badge -->
  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.94" stroke="#29483B" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="-160" cy="0" r="5" fill="#B35D6F"/>
    <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#29483B" letter-spacing="1.2">
      FLORETTTZ • FESTIVE HAMPERS &amp; DIYAS
    </text>
  </g>
</svg>
