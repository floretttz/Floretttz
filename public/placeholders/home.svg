<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FDF4EA"/>
      <stop offset="100%" stop-color="#F9E8D6"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C28D67"/>
      <stop offset="100%" stop-color="#8F5C38"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="50%" stop-color="#FCE7EB"/>
      <stop offset="100%" stop-color="#F8B4C2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A2828" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Ambient Warm Lamp Light Halo -->
  <circle cx="400" cy="360" r="280" fill="url(#lampGlow)"/>
  <circle cx="400" cy="380" r="220" fill="none" stroke="#E6CEBD" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Artisan Flower Lamp Illustration -->
  <g filter="url(#softShadow)">
    <!-- Wooden Lamp Base -->
    <ellipse cx="400" cy="570" rx="140" ry="24" fill="url(#woodGrad)" stroke="#734726" stroke-width="2"/>
    <ellipse cx="400" cy="564" rx="130" ry="20" fill="#D4A37D"/>
    
    <!-- Lamp Stem (Brass/Gold) -->
    <path d="M400 564 Q385 460 400 370" stroke="#D97706" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M399 564 Q384 460 399 370" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Artisan Flower Petals (Lotus / Tulip Craft Lamp) -->
    <g transform="translate(400, 340)">
      <!-- Outer Back Petals -->
      <path d="M0 0 C-120 -80 -90 -220 0 -220 C90 -220 120 -80 0 0 Z" fill="url(#petalGrad)" stroke="#E896A8" stroke-width="2" opacity="0.9"/>
      <path d="M0 0 C-160 -40 -150 -180 -50 -180 C10 -180 0 -60 0 0 Z" fill="url(#petalGrad)" stroke="#E896A8" stroke-width="2" opacity="0.85"/>
      <path d="M0 0 C160 -40 150 -180 50 -180 C-10 -180 0 -60 0 0 Z" fill="url(#petalGrad)" stroke="#E896A8" stroke-width="2" opacity="0.85"/>

      <!-- Glowing Light Bulb in Center -->
      <circle cx="0" cy="-90" r="45" fill="#FEF08A" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="0" cy="-90" r="30" fill="#FFFFFF"/>
      <circle cx="0" cy="-90" r="20" fill="#FFFBEB"/>

      <!-- Inner Front Petals -->
      <path d="M-60 10 C-100 -50 -70 -130 0 -120 C-30 -40 -30 0 -60 10 Z" fill="#FCE7EB" stroke="#B35D6F" stroke-width="2"/>
      <path d="M60 10 C100 -50 70 -130 0 -120 C30 -40 30 0 60 10 Z" fill="#FCE7EB" stroke="#B35D6F" stroke-width="2"/>
      <path d="M0 15 C-40 -30 -30 -100 0 -90 C30 -100 40 -30 0 15 Z" fill="#FFFFFF" stroke="#B35D6F" stroke-width="2.5"/>

      <!-- Calyx Leaf Base -->
      <path d="M-30 15 Q0 35 30 15 Q15 -5 0 0 Q-15 -5 -30 15 Z" fill="#29483B"/>
    </g>

    <!-- Warm Light Beams / Rays -->
    <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="260" y1="200" x2="230" y2="180"/>
      <line x1="540" y1="200" x2="570" y2="180"/>
      <line x1="400" y1="100" x2="400" y2="70"/>
      <line x1="310" y1="130" x2="290" y2="105"/>
      <line x1="490" y1="130" x2="510" y2="105"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#D97706" opacity="0.85">
    <path d="M200 320 Q205 335 220 340 Q205 345 200 360 Q195 345 180 340 Q195 335 200 320 Z"/>
    <path d="M600 300 Q604 312 616 316 Q604 320 600 332 Q596 320 584 316 Q596 312 600 300 Z"/>
  </g>

  <!-- Bottom Brand Sample Badge -->
  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.94" stroke="#29483B" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="-160" cy="0" r="5" fill="#B35D6F"/>
    <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#29483B" letter-spacing="1.2">
      FLORETTTZ • HOME DECOR &amp; LAMPS
    </text>
  </g>
</svg>
